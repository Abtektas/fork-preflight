[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.94.0"
license = "BSD-3-Clause"
repository = "https://github.com/Abtektas/fork-preflight"

[workspace.dependencies]
clap = { version = "=4.6.0", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tempfile = "=3.27.0"
